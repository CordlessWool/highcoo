name: Test

on: [push]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t highcoo:ci .

      - name: Export image
        run: docker save highcoo:ci | gzip > highcoo-ci.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: highcoo-ci
          path: highcoo-ci.tar.gz
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: highcoo
          POSTGRES_PASSWORD: highcoo
          POSTGRES_DB: highcoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: highcoo-ci

      - name: Load image
        run: docker load < highcoo-ci.tar.gz

      - name: Start app container
        run: |
          docker run -d \
            --name highcoo-app \
            --network host \
            --health-cmd "wget -qO- http://localhost:3001 || exit 1" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 20 \
            -e DATABASE_URL=postgresql://highcoo:highcoo@localhost:5432/highcoo_test \
            -e BODY_SIZE_LIMIT=Infinity \
            -e ORIGIN=http://localhost:3001 \
            -e ALLOW_REGISTRATION=true \
            highcoo:ci

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' highcoo-app 2>/dev/null)
            echo "Health status: $status ($i)"
            if [ "$status" = "healthy" ]; then
              echo "App is ready"
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Status}}' highcoo-app)" = "exited" ]; then
              echo "Container exited unexpectedly" >&2
              docker logs highcoo-app >&2
              exit 1
            fi
            sleep 5
          done
          echo "App did not become healthy in time" >&2
          docker logs highcoo-app >&2
          exit 1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          CI: true
          BASE_URL: 'http://localhost:3001'
          DATABASE_URL_TEST: postgresql://highcoo:highcoo@localhost:5432/highcoo_test

      - name: Print app logs on failure
        if: failure()
        run: docker logs highcoo-app

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 3
